            <p class="text-center mt-6 text-lg leading-8 text-gray-600">

            <div class="py-6 px-6 sm:py-12 lg:px-8">

                    Donation Amount

                  <div class="relative">
                    <input
                      id="donationAmount"
                      class="block w-full rounded-md border-0 py-1.5 pl-7 pr-20 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-xl md:text-2xl lg:text-3xl sm:leading-6"
                      type="text"
                      placeholder="0.00"
                      name="property"
                      oninput="formatNumberInput(this)"
                    />
                    <div class="absolute inset-y-0 right-5 flex items-center">
                      $
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="mx-auto max-w-7xl px-6 lg:px-8 py-1 sm:py-3">
            <dl

              <div class="mx-auto flex items-center max-w-xs flex-col gap-y-1">
                <div>
                  <h1
                    class="text-5xl font-semibold tracking-tight text-gray-900 sm:text-4xl"

                    With Savings

                  <hr
                    class="w-full h-1 mx-auto my-4 bg-green-100 border-0 rounded md:mb-10 dark:bg-green-600"

                </div>
                <dt class="text-base leading-7 text-gray-600">
                  State Tax Deduction

                <dd
                  class="order-second text-3xl font-semibold tracking-tight text-gray-900 sm:text-4xl"
                >
                  $20,000
                </dd>
              </div>
              <div class="mx-auto flex items-center max-w-xs flex-col gap-y-4">
                <div>
                  <h1
                    class="text-5xl font-semibold tracking-tight text-gray-900 sm:text-4xl"
                  >
                    Without Savings
                  </h1>
                  <hr
                    class="w-full h-1 mx-auto my-4 bg-green-100 border-0 rounded md:mb-10 dark:bg-orange-600"
                  />
                </div>
                <dt class="text-base leading-7 text-gray-600">
                  Net Cost to Tax Payer
                </dt>
                <dd
                  class="order-second text-3xl font-semibold tracking-tight text-gray-900 sm:text-4xl"

                  $35,000
                </dd>
              </div>
            </dl>
          </div>
        </div>

  <script>
    const numberInput = document.getElementById('donationAmount');

    function formatNumberInput(input) {
      // Remove existing commas and non-numeric characters
      const inputValue = input.value.replace(/[^0-9]/g, '');

      // Format the value with commas
      const formattedValue = Number(inputValue).toLocaleString();

      // Set the formatted value back into the input field
      input.value = `$ ${formattedValue}`;
    }
