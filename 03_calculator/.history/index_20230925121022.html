<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CC calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <style></style>
  <body>
    <main class="container mx-auto my-5 xl:my-10">
      <div class="flex mb-5 text-center">
        <h1
          class="flex-1 text-right text-2xl font-bold underline underline-offset-4"
        >
          Donation Amount:
        </h1>
        <div class="flex-1 text-left ml-10 text-2xl">
          <input
            id="donationAmount"
            class="bg-green-300 text-black-500 px-2"
            type="number"
            placeholder="Enter amount here"
          />
        </div>
      </div>
      <div class="flex grid xl:grid-cols-2 gap-3">
        <div class="bg-blue-300 rounded-lg p-5 grid gap-5">
          <h2 class="text-center font-bold text-xl pb-6">With Savings</h2>
          <div class="flex grid grid-cols-2">
            <p class="text-right">State Tax Deduction Savings :</p>
            <div class="flex-1 text-left ml-10">
              <span
                id="stateTaxDeductionSavings"
                class="bg-green-300 p-2 rounded-xl px-5"
                >$1,000</span
              >
            </div>
          </div>
          <div class="flex grid grid-cols-2">
            <p class="text-right">State Tax Savings from Credit :</p>
            <div class="flex-1 text-left ml-10">
              <span
                id="stateTaxSavingsFromCredit"
                class="bg-green-300 p-2 rounded-xl px-5"
                >$15,000</span
              >
            </div>
          </div>
          <div class="flex grid grid-cols-2">
            <p class="text-right">Federal Tax Deduction Savings :</p>
            <div class="flex-1 text-left ml-10">
              <span
                id="federalTaxDeduction"
                class="bg-green-300 p-2 rounded-xl px-5"
                >$5,000</span
              >
            </div>
          </div>
          <div class="text-center flex grid grid-cols-2">
            <strong class="text-right">Net Cost to Tax Payer :</strong>
            <div class="flex-1 text-left ml-10">
              <span
                id="netCostToTaxPayer"
                class="bg-green-300 p-2 rounded-xl px-5 font-bold"
                >$21,000</span
              >
            </div>
          </div>
        </div>
        <div class="bg-blue-300 rounded-lg p-5">
          <h2>Without Savings</h2>
          <div>
            <strong>Net Cost to Tax Payer</strong>
            <div></div>
          </div>
        </div>
      </div>
      <div>
        <p>Disclaimers Go Here</p>
        <p>Chris Purnell to Provide</p>
      </div>
    </main>
  </body>
  <script></script>
</html>
