  <script>
    const numberInput = document.getElementById('donationAmount');

    function formatNumberInput(input) {
      // Remove existing commas and non-numeric characters
      const inputValue = input.value.replace(/[^0-9]/g, '');

      // Format the value with commas
      const formattedValue = Number(inputValue).toLocaleString();

      // Set the formatted value back into the input field
      input.value = `$ ${formattedValue}`;
    }
