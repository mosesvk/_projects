<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CC calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <style>
    /* Style for the smooth transition */
    .hidden-by-default.transition-opacity {
      opacity: 1;
    }

    .hidden-by-default.transition-max-h {
      max-height: 100%;
    }


  </style>
  <body>
    <main class="container mx-auto my-5 xl:my-10 grid gap-5 isolate bg-white mb-28">
      <div id="donationSection" class="sm:col-span-2">
        <label
          class=" text-xl block text-sm font-semibold leading-6 text-gray-900 mb-2.5"
        >
          Donation Amount:
        </label>
        <div class="relative">
          <input
            id="donationAmount"
            class="block w-full min-w-[12rem] rounded-md border-0 py-2 px-3 pr-10 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
            type="text"
            placeholder="Enter amount here"
            oninput="formatNumberInput(this)"
          />
        </div>
      </div>
      <div
        class="hidden-by-default opacity-0 max-h-0 overflow-hidden duration-500 ease-in-out flex grid lg:grid-cols-2 gap-5"
      >
        <div class="bg-[#106dfd70] rounded-lg p-5 grid gap-5">
          <h2 class="text-center font-bold text-xl pb-6">With Savings</h2>
          <div class="flex grid grid-cols-2">
            <p class="text-right">State Tax Deduction Savings :</p>
            <div class="flex-1 text-left ml-10">
              <span
                id="stateTaxDeductionSavings"
                class="bg-[#83b240a3] p-2 rounded-xl px-5"
                >$1,000</span
              >
            </div>
          </div>
          <div class="flex grid grid-cols-2">
            <p class="text-right">State Tax Savings from Credit :</p>
            <div class="flex-1 text-left ml-10">
              <span
                id="stateTaxSavingsFromCredit"
                class="bg-[#83b240a3] p-2 rounded-xl px-5"
                >$15,000</span
              >
            </div>
          </div>
          <div class="flex grid grid-cols-2">
            <p class="text-right">Federal Tax Deduction Savings :</p>
            <div class="flex-1 text-left ml-10">
              <span
                id="federalTaxDeduction"
                class="bg-[#83b240a3] p-2 rounded-xl px-5"
                >$5,000</span
              >
            </div>
          </div>
          <div class="text-center flex grid grid-cols-2">
            <strong class="text-right">Net Cost to Tax Payer :</strong>
            <div class="flex-1 text-left ml-10">
              <span
                id="netCostToTaxPayerInclude"
                class="bg-[#83b240a3] p-2 rounded-xl px-5 font-bold"
                >$21,000</span
              >
            </div>
          </div>
        </div>
        <div class="bg-[#106dfd70] rounded-lg p-5 grid gap-5">
          <h2 class="text-center font-bold text-xl pb-6">Without Savings</h2>
          <div class="text-center flex grid grid-cols-2">
            <strong class="text-right">Net Cost to Tax Payer</strong>
            <div class="flex-1 text-left ml-10">
              <span
                id="netCostToTaxPayerWithout"
                class="bg-[#83b240a3] p-2 rounded-xl px-5 font-bold"
                >$30,000</span
              >
            </div>
          </div>
        </div>
      </div>
      <div
        class="hidden-by-default opacity-0 max-h-0 overflow-hidden duration-500 ease-in-out bg-[#106dfd70] rounded-lg p-5 grid gap-5 text-center"
      >
        <p>Disclaimers Go Here</p>
        <p>Chris Purnell to Provide</p>
      </div>
    </main>
  </body>
  <script>
    const numberInput = document.getElementById('donationAmount');

    function formatNumberInput(input) {
      // Remove existing commas and non-numeric characters
      const inputValue = input.value.replace(/[^0-9]/g, '');

      // Format the value with commas
      const formattedValue = Number(inputValue).toLocaleString();

      // Set the formatted value back into the input field
      input.value = `$ ${formattedValue}`;
    }

    const input = document.querySelector('#donationAmount');
    const hiddenElements = document.querySelectorAll('.hidden-by-default');

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        console.log(e);

        // Check if input value is a valid number
        let val = input.value
          .split('')
          .slice(2, input.value.split('').length)
          .join('')
          .replace(/[^0-9]/g, '');

        if (!isNaN(val) && parseFloat(val) > 0) {
          // Display the hidden elements by setting their display property to 'block'
          hiddenElements.forEach((element) => {
            // element.classList.remove('hidden');
            element.classList.remove('opacity-0', 'max-h-0');
          });
        }
      }
    });
  </script>
</html>
