<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickbase Data Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-2">Quickbase Data Extractor</h1>
        <p class="text-gray-600 mb-6">Connect to and extract data from your Quickbase table</p>
        
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-2">Configuration</h2>
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Realm Hostname</label>
                    <input type="text" id="realmHostname" class="w-full p-2 border border-gray-300 rounded" 
                           value="capincrouse.quickbase.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">User Token</label>
                    <input type="password" id="userToken" class="w-full p-2 border border-gray-300 rounded" 
                           placeholder="Your Quickbase user token">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">App ID</label>
                        <input type="text" id="appId" class="w-full p-2 border border-gray-300 rounded" 
                               value="bps9da9i5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Table ID</label>
                        <input type="text" id="tableId" class="w-full p-2 border border-gray-300 rounded" 
                               value="bs2bkir3i">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="flex flex-wrap gap-4 mb-6">
            <button id="testConnection" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                Test Connection
            </button>
            <button id="getTableFields" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">
                Get Table Fields
            </button>
            <button id="getTableData" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded">
                Get Table Data
            </button>
            <button id="clearResults" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded">
                Clear Results
            </button>
        </div>
        
        <div>
            <h2 class="text-lg font-semibold mb-2">Results</h2>
            <div id="results" class="bg-gray-50 p-4 rounded border overflow-auto max-h-96">
                <p class="text-gray-500 italic">Results will appear here...</p>
            </div>
        </div>
    </div>

    <script>
        // File: quickbase-extractor.js
        // This file implements Quickbase data extraction functions

        document.addEventListener('DOMContentLoaded', function() {
            // Set up event listeners
            document.getElementById('testConnection').addEventListener('click', testConnection);
            document.getElementById('getTableFields').addEventListener('click', getTableFields);
            document.getElementById('getTableData').addEventListener('click', getTableData);
            document.getElementById('clearResults').addEventListener('click', clearResults);
            
            // Function to get the configuration values
            function getConfig() {
                return {
                    realmHostname: document.getElementById('realmHostname').value.trim(),
                    userToken: document.getElementById('userToken').value.trim(),
                    appId: document.getElementById('appId').value.trim(),
                    tableId: document.getElementById('tableId').value.trim()
                };
            }
            
            // Function to validate configuration
            function validateConfig(config) {
                if (!config.realmHostname || !config.userToken || !config.appId || !config.tableId) {
                    document.getElementById('results').innerHTML = 
                        '<p class="text-red-500">Error: Please fill in all fields</p>';
                    return false;
                }
                return true;
            }
            
            // Function to test the connection
            async function testConnection() {
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '<p class="text-blue-500">Testing connection...</p>';
                
                const config = getConfig();
                if (!validateConfig(config)) return;
                
                try {
                    // Try to get app info
                    const response = await fetch(`https://api.quickbase.com/v1/apps/${config.appId}`, {
                        method: 'GET',
                        headers: {
                            'QB-Realm-Hostname': config.realmHostname,
                            'Authorization': `QB-USER-TOKEN ${config.userToken}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw {
                            status: response.status,
                            message: errorData.message || 'Failed to connect',
                            description: errorData.description || ''
                        };
                    }
                    
                    const appInfo = await response.json();
                    
                    resultsDiv.innerHTML = `
                        <p class="text-green-500 font-semibold">✅ Connection successful!</p>
                        <h3 class="font-semibold mt-4">App Information:</h3>
                        <pre class="bg-gray-100 p-3 rounded text-sm overflow-x-auto">${JSON.stringify(appInfo, null, 2)}</pre>
                    `;
                } catch (error) {
                    let errorMessage = error.message || 'Unknown error occurred';
                    if (error.description) {
                        errorMessage += `<br>Details: ${error.description}`;
                    }
                    
                    resultsDiv.innerHTML = `
                        <p class="text-red-500 font-semibold">❌ Connection failed!</p>
                        <div class="mt-2 text-red-500">${errorMessage}</div>
                        <h3 class="font-semibold mt-4">Troubleshooting Tips:</h3>
                        <ul class="list-disc list-inside">
                            <li>Verify your user token is current and has API access permissions</li>
                            <li>Check if the app ID and table ID are correct</li>
                            <li>Try generating a new user token in Quickbase</li>
                        </ul>
                    `;
                }
            }
            
            // Function to get table fields
            async function getTableFields() {
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '<p class="text-blue-500">Getting table fields...</p>';
                
                const config = getConfig();
                if (!validateConfig(config)) return;
                
                try {
                    // Get fields for the specified table
                    const response = await fetch(`https://api.quickbase.com/v1/fields?tableId=${config.tableId}`, {
                        method: 'GET',
                        headers: {
                            'QB-Realm-Hostname': config.realmHostname,
                            'Authorization': `QB-USER-TOKEN ${config.userToken}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw {
                            status: response.status,
                            message: errorData.message || 'Failed to get fields',
                            description: errorData.description || ''
                        };
                    }
                    
                    const fields = await response.json();
                    
                    // Create a table to display the fields
                    let tableHtml = `
                        <p class="text-green-500 font-semibold">✅ Retrieved ${fields.length} fields</p>
                        <div class="overflow-x-auto mt-4">
                            <table class="min-w-full bg-white">
                                <thead class="bg-gray-100">
                                    <tr>
                                        <th class="py-2 px-4 border-b text-left">Field ID</th>
                                        <th class="py-2 px-4 border-b text-left">Label</th>
                                        <th class="py-2 px-4 border-b text-left">Type</th>
                                        <th class="py-2 px-4 border-b text-left">Required</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    fields.forEach(field => {
                        tableHtml += `
                            <tr>
                                <td class="py-2 px-4 border-b">${field.id}</td>
                                <td class="py-2 px-4 border-b">${field.label}</td>
                                <td class="py-2 px-4 border-b">${field.fieldType}</td>
                                <td class="py-2 px-4 border-b">${field.required ? 'Yes' : 'No'}</td>
                            </tr>
                        `;
                    });
                    
                    tableHtml += `
                                </tbody>
                            </table>
                        </div>
                        <div class="mt-4">
                            <h3 class="font-semibold">Raw Field Data:</h3>
                            <pre class="bg-gray-100 p-3 rounded text-sm overflow-x-auto mt-2">${JSON.stringify(fields, null, 2)}</pre>
                        </div>
                    `;
                    
                    resultsDiv.innerHTML = tableHtml;
                } catch (error) {
                    let errorMessage = error.message || 'Unknown error occurred';
                    if (error.description) {
                        errorMessage += `<br>Details: ${error.description}`;
                    }
                    
                    resultsDiv.innerHTML = `
                        <p class="text-red-500 font-semibold">❌ Failed to get fields!</p>
                        <div class="mt-2 text-red-500">${errorMessage}</div>
                    `;
                }
            }
            
            // Function to get table data
            async function getTableData() {
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '<p class="text-blue-500">Getting table data...</p>';
                
                const config = getConfig();
                if (!validateConfig(config)) return;
                
                try {
                    // Build the query to get records
                    const queryOptions = {
                        from: config.tableId,
                        select: [],  // We'll get all fields
                        options: {
                            skip: 0,
                            top: 20  // Limit to 20 records for testing
                        }
                    };
                    
                    // Query the records
                    const response = await fetch('https://api.quickbase.com/v1/records/query', {
                        method: 'POST',
                        headers: {
                            'QB-Realm-Hostname': config.realmHostname,
                            'Authorization': `QB-USER-TOKEN ${config.userToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(queryOptions)
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw {
                            status: response.status,
                            message: errorData.message || 'Failed to get records',
                            description: errorData.description || ''
                        };
                    }
                    
                    const result = await response.json();
                    
                    if (!result.data || result.data.length === 0) {
                        resultsDiv.innerHTML = `
                            <p class="text-yellow-500 font-semibold">No records found in the table.</p>
                        `;
                        return;
                    }
                    
                    // Get the field information for display
                    const fields = result.fields || [];
                    const records = result.data || [];
                    
                    // Create a simple preview table with the first few fields and records
                    let fieldDisplayCount = Math.min(fields.length, 5);  // Show up to 5 fields
                    let recordDisplayCount = Math.min(records.length, 10);  // Show up to 10 records
                    
                    let tableHtml = `
                        <p class="text-green-500 font-semibold">✅ Retrieved ${records.length} records (showing ${recordDisplayCount})</p>
                        <div class="overflow-x-auto mt-4">
                            <table class="min-w-full bg-white">
                                <thead class="bg-gray-100">
                                    <tr>
                    `;
                    
                    // Add headers for the fields
                    fields.slice(0, fieldDisplayCount).forEach(field => {
                        tableHtml += `<th class="py-2 px-4 border-b text-left">${field.label}</th>`;
                    });
                    
                    tableHtml += `
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    // Add rows for the records
                    records.slice(0, recordDisplayCount).forEach(record => {
                        tableHtml += '<tr>';
                        
                        fields.slice(0, fieldDisplayCount).forEach(field => {
                            const fieldId = field.id.toString();
                            const cellValue = record[fieldId] ? 
                                (typeof record[fieldId].value === 'object' ? 
                                    JSON.stringify(record[fieldId].value) : 
                                    record[fieldId].value) : 
                                '';
                            
                            tableHtml += `<td class="py-2 px-4 border-b">${cellValue}</td>`;
                        });
                        
                        tableHtml += '</tr>';
                    });
                    
                    tableHtml += `
                                </tbody>
                            </table>
                        </div>
                        <p class="text-sm text-gray-500 mt-2">Showing ${recordDisplayCount} of ${records.length} records and ${fieldDisplayCount} of ${fields.length} fields.</p>
                        <div class="mt-4">
                            <h3 class="font-semibold">Full Response Data:</h3>
                            <pre class="bg-gray-100 p-3 rounded text-sm overflow-x-auto mt-2">${JSON.stringify(result, null, 2)}</pre>
                        </div>
                    `;
                    
                    resultsDiv.innerHTML = tableHtml;
                } catch (error) {
                    let errorMessage = error.message || 'Unknown error occurred';
                    if (error.description) {
                        errorMessage += `<br>Details: ${error.description}`;
                    }
                    
                    resultsDiv.innerHTML = `
                        <p class="text-red-500 font-semibold">❌ Failed to get table data!</p>
                        <div class="mt-2 text-red-500">${errorMessage}</div>
                    `;
                }
            }
            
            // Function to clear results
            function clearResults() {
                document.getElementById('results').innerHTML = '<p class="text-gray-500 italic">Results will appear here...</p>';
            }
        });
    </script>
</body>
</html>
