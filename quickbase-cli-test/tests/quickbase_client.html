<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickbase CLI Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import your quickbase-client.js file -->
    <script src="../db/QuickbaseClient.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4">Quickbase CLI</h1>
        
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-2">Configuration</h2>
            <form id="configForm" class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Realm Hostname</label>
                    <input type="text" id="realmHostname" class="w-full p-2 border border-gray-300 rounded" 
                           value="capincrouse.quickbase.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">User Token</label>
                    <input type="password" id="userToken" class="w-full p-2 border border-gray-300 rounded" 
                           placeholder="Your Quickbase user token">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">App ID</label>
                        <input type="text" id="appId" class="w-full p-2 border border-gray-300 rounded" 
                               value="bps9da9i5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Table ID</label>
                        <input type="text" id="tableId" class="w-full p-2 border border-gray-300 rounded" 
                               value="bs2bkir3i">
                    </div>
                </div>
            </form>
        </div>
        
        <div class="mb-6 flex flex-wrap gap-2">
            <button id="initClient" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                Initialize Client
            </button>
            <button id="testConnection" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded" disabled>
                Test Connection
            </button>
            <button id="getTables" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded" disabled>
                Get Tables
            </button>
            <button id="getFields" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded" disabled>
                Get Fields
            </button>
            <button id="getRecords" class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded" disabled>
                Get Records
            </button>
            <button id="clearOutput" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded">
                Clear Output
            </button>
        </div>
        
        <div>
            <h2 class="text-lg font-semibold mb-2">Output</h2>
            <pre id="output" class="bg-gray-50 p-4 rounded border overflow-auto h-96 text-sm">Ready to execute commands...</pre>
        </div>
    </div>

    <script>
        // Quickbase CLI Interface
        document.addEventListener('DOMContentLoaded', function() {
            let qbClient = null;
            const outputEl = document.getElementById('output');
            
            // Function to log output
            function log(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                let prefix = '';
                
                switch(type) {
                    case 'success':
                        prefix = `[${timestamp}] ✅ `;
                        break;
                    case 'error':
                        prefix = `[${timestamp}] ❌ `;
                        break;
                    case 'command':
                        prefix = `[${timestamp}] $ `;
                        break;
                    default:
                        prefix = `[${timestamp}] `;
                }
                
                if (typeof message === 'object') {
                    outputEl.textContent += prefix + '\n';
                    outputEl.textContent += JSON.stringify(message, null, 2) + '\n\n';
                } else {
                    outputEl.textContent += prefix + message + '\n\n';
                }
                
                // Scroll to bottom
                outputEl.scrollTop = outputEl.scrollHeight;
            }
            
            // Function to enable/disable buttons based on client state
            function updateButtonState() {
                const hasClient = qbClient !== null;
                const isConnected = hasClient && qbClient.isConnected;
                
                document.getElementById('testConnection').disabled = !hasClient;
                document.getElementById('getTables').disabled = !isConnected;
                document.getElementById('getFields').disabled = !isConnected;
                document.getElementById('getRecords').disabled = !isConnected;
            }
            
            // Initialize client
            document.getElementById('initClient').addEventListener('click', () => {
                const realmHostname = document.getElementById('realmHostname').value.trim();
                const userToken = document.getElementById('userToken').value.trim();
                const appId = document.getElementById('appId').value.trim();
                const tableId = document.getElementById('tableId').value.trim();
                
                if (!realmHostname || !userToken || !appId || !tableId) {
                    log('Please fill in all configuration fields', 'error');
                    return;
                }
                
                log(`qb-cli init --realm ${realmHostname} --app-id ${appId} --table-id ${tableId}`, 'command');
                
                try {
                    qbClient = new QuickbaseClient({
                        realmHostname: realmHostname,
                        userToken: userToken,
                        appId: appId,
                        tableId: tableId
                    });
                    
                    log('Quickbase client initialized successfully', 'success');
                    updateButtonState();
                } catch (error) {
                    log(`Error initializing client: ${error.message}`, 'error');
                }
            });
            
            // Test connection
            document.getElementById('testConnection').addEventListener('click', async () => {
                if (!qbClient) {
                    log('Please initialize the client first', 'error');
                    return;
                }
                
                log('qb-cli connection test', 'command');
                
                try {
                    const result = await qbClient.testConnection();
                    
                    if (result.success) {
                        log('Connection test successful', 'success');
                        log(result.appInfo);
                        updateButtonState();
                    } else {
                        log(`Connection test failed: ${result.error.message}`, 'error');
                    }
                } catch (error) {
                    log(`Error testing connection: ${error.message}`, 'error');
                }
            });
            
            // Get tables
            document.getElementById('getTables').addEventListener('click', async () => {
                if (!qbClient || !qbClient.isConnected) {
                    log('Please initialize and connect the client first', 'error');
                    return;
                }
                
                log(`qb-cli table list --app-id ${qbClient.appId}`, 'command');
                
                try {
                    const tables = await qbClient.getTables();
                    log(`Retrieved ${tables.length} tables`, 'success');
                    log(tables);
                } catch (error) {
                    log(`Error getting tables: ${error.message}`, 'error');
                }
            });
            
            // Get fields
            document.getElementById('getFields').addEventListener('click', async () => {
                if (!qbClient || !qbClient.isConnected) {
                    log('Please initialize and connect the client first', 'error');
                    return;
                }
                
                log(`qb-cli field list --table-id ${qbClient.tableId}`, 'command');
                
                try {
                    const fields = await qbClient.getFields();
                    log(`Retrieved ${fields.length} fields`, 'success');
                    log(fields);
                } catch (error) {
                    log(`Error getting fields: ${error.message}`, 'error');
                }
            });
            
            // Get records
            document.getElementById('getRecords').addEventListener('click', async () => {
                if (!qbClient || !qbClient.isConnected) {
                    log('Please initialize and connect the client first', 'error');
                    return;
                }
                
                log(`qb-cli records query --from ${qbClient.tableId} --top 10`, 'command');
                
                try {
                    const records = await qbClient.queryRecords({ top: 10 });
                    log(`Retrieved ${records.data.length} records`, 'success');
                    log(records);
                } catch (error) {
                    log(`Error getting records: ${error.message}`, 'error');
                }
            });
            
            // Clear output
            document.getElementById('clearOutput').addEventListener('click', () => {
                outputEl.textContent = 'Output cleared...\n\n';
            });
        });
    </script>
</body>
</html>
