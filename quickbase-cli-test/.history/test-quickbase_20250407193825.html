<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickbase API Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6">Quickbase API Connection Test</h1>
        
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-2">Configuration</h2>
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Realm Hostname</label>
                    <input type="text" id="realmHostname" class="w-full p-2 border border-gray-300 rounded" 
                           placeholder="e.g., capincrouse.quickbase.com" value="capincrouse.quickbase.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">User Token</label>
                    <input type="password" id="userToken" class="w-full p-2 border border-gray-300 rounded" 
                           placeholder="Your Quickbase user token">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">App ID</label>
                    <input type="text" id="appId" class="w-full p-2 border border-gray-300 rounded" 
                           placeholder="Your Quickbase app ID" value="bbkmdcurd2sd5cpqvf58dsabq2q">
                </div>
            </div>
        </div>
        
        <div class="flex justify-between mb-6">
            <button id="testConnection" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                Test Connection
            </button>
            <button id="clearResults" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded">
                Clear Results
            </button>
        </div>
        
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-2">Connection Results</h2>
            <div id="results" class="bg-gray-50 p-4 rounded border overflow-auto max-h-96">
                <p class="text-gray-500 italic">Results will appear here...</p>
            </div>
        </div>
    </div>

    <script>
        // File: quickbase-test.js
        // This file implements the Quickbase API connection test

        document.addEventListener('DOMContentLoaded', function() {
            // Set up event listeners
            document.getElementById('testConnection').addEventListener('click', testQuickbaseConnection);
            document.getElementById('clearResults').addEventListener('click', clearResults);
            
            // Function to test the Quickbase connection
            async function testQuickbaseConnection() {
                const resultsDiv = document.getElementById('results');
                
                // Clear previous results
                resultsDiv.innerHTML = '<p class="text-blue-500">Testing connection...</p>';
                
                // Get configuration values
                const realmHostname = document.getElementById('realmHostname').value.trim();
                const userToken = document.getElementById('userToken').value.trim();
                const appId = document.getElementById('appId').value.trim();
                
                // Validate input
                if (!realmHostname || !userToken || !appId) {
                    resultsDiv.innerHTML = '<p class="text-red-500">Error: Please fill in all fields</p>';
                    return;
                }
                
                try {
                    // First, test if we can get app info
                    const appInfo = await fetchAppInfo(realmHostname, userToken, appId);
                    
                    // Display success message and app info
                    let resultHtml = `
                        <p class="text-green-500 font-semibold">✅ Connection successful!</p>
                        <h3 class="font-semibold mt-4">App Information:</h3>
                        <pre class="bg-gray-100 p-3 rounded text-sm overflow-x-auto">${JSON.stringify(appInfo, null, 2)}</pre>
                    `;
                    
                    // Try to get tables
                    try {
                        const tables = await fetchTables(realmHostname, userToken, appId);
                        
                        resultHtml += `
                            <h3 class="font-semibold mt-4">Tables (${tables.length}):</h3>
                            <ul class="list-disc list-inside">
                        `;
                        
                        tables.forEach(table => {
                            resultHtml += `<li>${table.name} (ID: ${table.id})</li>`;
                        });
                        
                        resultHtml += '</ul>';
                    } catch (tableError) {
                        resultHtml += `
                            <h3 class="font-semibold mt-4 text-yellow-500">Tables Error:</h3>
                            <pre class="bg-gray-100 p-3 rounded text-sm overflow-x-auto text-red-500">${JSON.stringify(tableError, null, 2)}</pre>
                        `;
                    }
                    
                    resultsDiv.innerHTML = resultHtml;
                } catch (error) {
                    // Display error message
                    let errorMessage = '';
                    
                    if (error.response) {
                        errorMessage = `Status: ${error.status}<br>Message: ${error.message}`;
                        if (error.data) {
                            errorMessage += `<br>Details: ${JSON.stringify(error.data)}`;
                        }
                    } else {
                        errorMessage = error.message || 'Unknown error occurred';
                    }
                    
                    resultsDiv.innerHTML = `
                        <p class="text-red-500 font-semibold">❌ Connection failed!</p>
                        <div class="mt-2 text-red-500">${errorMessage}</div>
                        <h3 class="font-semibold mt-4">Troubleshooting Tips:</h3>
                        <ul class="list-disc list-inside">
                            <li>Check if your realm hostname is correctly formatted (with or without .quickbase.com)</li>
                            <li>Verify your user token is current and has API access permissions</li>
                            <li>Confirm the app ID is correct</li>
                            <li>Try generating a new user token in Quickbase</li>
                        </ul>
                    `;
                }
            }
            
            // Function to fetch app information
            async function fetchAppInfo(realm, token, appId) {
                const response = await fetch(`https://api.quickbase.com/v1/apps/${appId}`, {
                    method: 'GET',
                    headers: {
                        'QB-Realm-Hostname': realm,
                        'Authorization': `QB-USER-TOKEN ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw {
                        status: response.status,
                        message: 'Failed to fetch app information',
                        data: errorData
                    };
                }
                
                return response.json();
            }
            
            // Function to fetch tables
            async function fetchTables(realm, token, appId) {
                const response = await fetch(`https://api.quickbase.com/v1/tables?appId=${appId}`, {
                    method: 'GET',
                    headers: {
                        'QB-Realm-Hostname': realm,
                        'Authorization': `QB-USER-TOKEN ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw {
                        status: response.status,
                        message: 'Failed to fetch tables',
                        data: errorData
                    };
                }
                
                return response.json();
            }
            
            // Function to clear results
            function clearResults() {
                document.getElementById('results').innerHTML = '<p class="text-gray-500 italic">Results will appear here...</p>';
            }
        });
    </script>
</body>
</html>
