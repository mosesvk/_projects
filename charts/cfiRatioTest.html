<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFI Ratio Chart Test</title>
    
    <!-- ApexCharts library -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .chart-container {
            margin-top: 30px;
            height: 550px;
            width: 100%;
            border: 1px solid #e0e0e0;
            padding: 10px;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #326eaa;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #244b76;
        }
        .controls {
            margin-bottom: 20px;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow: auto;
            max-height: 300px;
        }
    </style>
</head>
<body>
    <h1>CFI Ratio Chart Test</h1>
    
    <div class="controls">
        <button id="btnReloadScripts">Reload Scripts</button>
        <button id="btnClearChart">Clear Chart</button>
        <button id="btnCreateChart">Create Chart</button>
        <button id="btnDebugChart">Debug Chart</button>
    </div>
    
    <div class="chart-container">
        <div id="cfiRatio_chart"></div>
    </div>
    
    <h2>Console Output</h2>
    <pre id="console-output"></pre>
    
    <script>
        // Mock localStorage
        const mockLocalStorage = {};
        
        window.localStorage = {
            getItem: function(key) {
                return mockLocalStorage[key] || null;
            },
            setItem: function(key, value) {
                mockLocalStorage[key] = value;
            },
            removeItem: function(key) {
                delete mockLocalStorage[key];
            },
            clear: function() {
                for (const key in mockLocalStorage) {
                    delete mockLocalStorage[key];
                }
            }
        };
        
        // Mock getSelectedYearsFromLocalStorage
        window.getSelectedYearsFromLocalStorage = function() {
            return ['2021', '2022', '2023', '2024'];
        };
        
        // Mock firmName
        window.firmName = "Test University";
        
        // Mock style number function
        window.styleNumber = function(value, type, decimals = 2) {
            if (type === 'dollar') return '$' + parseFloat(value).toFixed(decimals);
            if (type === 'percent') return parseFloat(value).toFixed(decimals) + '%';
            return parseFloat(value).toFixed(decimals);
        };
        
        // Mock getStoredData and parseStoredData
        window.getStoredData = function(key) {
            return localStorage.getItem(key);
        };
        
        window.parseStoredData = function(data) {
            if (!data) return null;
            try {
                return JSON.parse(data);
            } catch (e) {
                console.error("Error parsing data:", e);
                return null;
            }
        };
        
        // Sample data
        const sampleData = {
            cfiRatio_Client: {
                "2021": { value: 2.5 },
                "2022": { value: 3.1 },
                "2023": { value: 2.8 },
                "2024": { value: 3.2 }
            },
            cfiRatio_peerAverage_Peer: {
                "2021": [2.1, 2.3, 2.5, 2.7],
                "2022": [2.4, 2.6, 2.8, 3.0],
                "2023": [2.2, 2.4, 2.6, 2.8],
                "2024": [2.5, 2.7, 2.9, 3.1]
            }
        };
        
        // Store sample data in mock localStorage
        localStorage.setItem("cfiData", JSON.stringify(sampleData));
        
        // Colors
        window.chartColors = {
            green: "#83b240",
            blue: "#326eaa",
            grey: "#c9cbcf",
            red: "#ff6384",
            orange: "#CD5A2C",
            yellow: "#EDAB20",
            purple: "#723682",
            black: "#000000"
        };
        
        // Override console.log to also display in the page
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        const originalConsoleWarn = console.warn;
        
        const consoleOutput = document.getElementById('console-output');
        
        console.log = function() {
            const args = Array.from(arguments);
            originalConsoleLog.apply(console, args);
            consoleOutput.innerHTML += args.map(arg => {
                if (typeof arg === 'object') return JSON.stringify(arg, null, 2);
                return arg;
            }).join(' ') + '\n';
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        };
        
        console.error = function() {
            const args = Array.from(arguments);
            originalConsoleError.apply(console, args);
            consoleOutput.innerHTML += '<span style="color: red;">' + args.map(arg => {
                if (typeof arg === 'object') return JSON.stringify(arg, null, 2);
                return arg;
            }).join(' ') + '</span>\n';
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        };
        
        console.warn = function() {
            const args = Array.from(arguments);
            originalConsoleWarn.apply(console, args);
            consoleOutput.innerHTML += '<span style="color: orange;">' + args.map(arg => {
                if (typeof arg === 'object') return JSON.stringify(arg, null, 2);
                return arg;
            }).join(' ') + '</span>\n';
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        };
        
        // Add script loading function
        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
        
        // Load our chart scripts
        async function loadChartScripts() {
            consoleOutput.innerHTML = '';
            console.log('Loading chart scripts...');
            
            try {
                await loadScript('./chartConfigFactory.js');
                console.log('Loaded chartConfigFactory.js');
                
                await loadScript('./chartManager.js');
                console.log('Loaded chartManager.js');
                
                await loadScript('./chartDisplayComponents.js');
                console.log('Loaded chartDisplayComponents.js');
                
                await loadScript('./chartIndex.js');
                console.log('Loaded chartIndex.js');
                
                console.log('All scripts loaded successfully');
            } catch (error) {
                console.error('Error loading scripts:', error);
            }
        }
        
        // Create a direct chart without using our chart system
        function createDirectChart() {
            const chartElement = document.getElementById('cfiRatio_chart');
            chartElement.innerHTML = '';
            
            const config = {
                series: [
                    {
                        name: "Client",
                        type: "column",
                        data: [2.5, 3.1, 2.8, 3.2]
                    },
                    {
                        name: "Peer Average",
                        type: "line",
                        data: [2.4, 2.7, 2.5, 2.8]
                    }
                ],
                chart: {
                    height: 550,
                    type: "line",
                    toolbar: {
                        show: false
                    }
                },
                stroke: {
                    width: [2, 3]
                },
                title: {
                    text: "CFI Overall Ratio (Direct)",
                    align: "center"
                },
                xaxis: {
                    categories: ["2021", "2022", "2023", "2024"]
                },
                yaxis: {
                    min: -4,
                    max: 10,
                    tickAmount: 7
                },
                annotations: {
                    yaxis: [{
                        y: -4,
                        borderColor: '#ff6384',
                        label: {
                            text: 'Critical',
                            style: {
                                color: '#fff',
                                background: '#ff6384'
                            }
                        }
                    }, {
                        y: 0,
                        borderColor: '#EDAB20',
                        label: {
                            text: 'Caution',
                            style: {
                                color: '#fff',
                                background: '#EDAB20'
                            }
                        }
                    }, {
                        y: 3,
                        borderColor: '#83b240',
                        label: {
                            text: 'Good',
                            style: {
                                color: '#fff',
                                background: '#83b240'
                            }
                        }
                    }]
                }
            };
            
            const chart = new ApexCharts(chartElement, config);
            chart.render();
            console.log('Direct chart created');
        }
        
        // Attach button event handlers
        document.getElementById('btnReloadScripts').addEventListener('click', loadChartScripts);
        
        document.getElementById('btnClearChart').addEventListener('click', function() {
            document.getElementById('cfiRatio_chart').innerHTML = '';
            console.log('Chart cleared');
        });
        
        document.getElementById('btnCreateChart').addEventListener('click', function() {
            if (window.chartManager && window.chartManager.createChartFromParsedData) {
                const parsedData = parseStoredData(localStorage.getItem('cfiData'));
                window.chartManager.createChartFromParsedData(
                    parsedData,
                    "cfiRatio_chart",
                    "cfiRatio_peerAverage_Peer",
                    "cfiRatio_Client",
                    "num",
                    1,
                    "cfiRatio",
                    false,
                    "CFI Overall Ratio",
                    "line"
                );
                console.log('Chart created using chartManager');
            } else {
                console.warn('chartManager not available, creating direct chart');
                createDirectChart();
            }
        });
        
        document.getElementById('btnDebugChart').addEventListener('click', function() {
            if (window.debugCfiRatioChart) {
                window.debugCfiRatioChart();
            } else {
                console.warn('debugCfiRatioChart not available, creating direct chart');
                createDirectChart();
            }
        });
        
        // Auto-load scripts when page loads
        window.addEventListener('DOMContentLoaded', loadChartScripts);
    </script>
</body>
</html>
