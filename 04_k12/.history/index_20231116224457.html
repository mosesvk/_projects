<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-12</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.15/dist/tailwind.min.css"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.1.1/flowbite.min.css"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.1.1/flowbite.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <!--FUNCTIONS SCRIPTS-->
    <script src="./components/_utility.js"></script>
    <script src="./components/_api.js"></script>
  </head>
  <body>
    <nav
      id="nav"
      class="fixed z-30 w-full bg-white border-b border-gray-200 dark:bg-gray-800 dark:border-gray-700"
    ></nav>
    <div
      class="flex pt-16 overflow-hidden bg-gray-50 dark:bg-gray-900 h-screen"
    >
      <aside
        id="sidebar"
        class="fixed top-0 left-0 z-20 flex flex-col flex-shrink-0 hidden w-64 h-full pt-16 font-normal duration-75 lg:flex transition-width"
      ></aside>
      <div
        class="fixed inset-0 z-10 hidden bg-gray-900/50 dark:bg-gray-900/90"
        id="sidebarBackdrop"
      ></div>
      <div
        id="main-content"
        class="relative w-full h-full overflow-y-auto bg-gray-50 lg:ml-64 dark:bg-gray-900"
      >
        <main class="px-4 pt-6 grid gap-y-4"></main>
      </div>
    </div>
    <div
      id="studentsMain_modal"
      tabindex="-1"
      aria-hidden="true"
      class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
    >
      <div class="relative p-4 w-full max-w-fit md:max-w-3xl max-h-full">
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
          <div
            class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600"
          >
            <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
              Students - Main
            </h3>
            <button
              type="button"
              class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
              data-modal-hide="${modalId}"
            >
              <svg
                class="w-3 h-3"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 14 14"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
                />
              </svg>
            </button>
          </div>

          <div class="flex flex-col mt-2">
            <div class="overflow-x-auto rounded-lg">
              <div class="inline-block min-w-full align-middle">
                <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
                  <table
                    class="w-full text-lg text-left text-gray-500 dark:text-gray-400"
                  >
                    <thead
                      class="text-xs text-gray-700 uppercase bg-green-200 dark:bg-gray-700 dark:text-green-200"
                    >
                      <tr id="studentsMain_row">
                        <th scope="col" class="px-6 py-3 text-lg">Client</th>
                        <th scope="col" class="px-6 py-3">Avg</th>
                        <th scope="col" class="px-6 py-3">Mid</th>
                        <th scope="col" class="px-6 py-3">Min</th>
                        <th scope="col" class="px-6 py-3">Max</th>
                      </tr>
                    </thead>
                    <tbody>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!--Components-->

    <script src="./components/comp_Nav.js"></script>
    <script src="./components/comp_Enrollment.js"></script>
    <script src="./components/comp_Report.js"></script>
    <script src="./components/comp_Sidebar.js"></script>
    <script src="./components/_uiManagement.js"></script>
    <script src="./components/charts.js"></script>
    <!-- <script src="./components/chart_display.js"></script> -->
  </body>
</html>
