  <head>

    <meta name="viewport" contfent="width=device-width, initial-scale=1.0" />
    <title>K-12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.15/dist/tailwind.min.css"
    />
