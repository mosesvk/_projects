<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>International</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.15/dist/tailwind.min.css"
    />


  </head>
  <body>
    <nav
      id="nav"
      class="fixed z-30 w-full bg-white border-b border-gray-200 dark:bg-gray-800 dark:border-gray-700"
    ></nav>
    <div class="flex pt-16 overflow-hidden bg-gray-50 dark:bg-gray-900">
      <aside
        id="sidebar"
        class="fixed top-0 left-0 z-20 flex flex-col flex-shrink-0 hidden w-64 h-full pt-16 font-normal duration-75 lg:flex transition-width"
      ></aside>
      <div
        class="fixed inset-0 z-10 hidden bg-gray-900/50 dark:bg-gray-900/90"
        id="sidebarBackdrop"
      ></div>
      <div id="main-content" class="relative w-full h-full overflow-y-auto bg-gray-50 lg:ml-64 dark:bg-gray-900">
        <main>
            <div class="px-4 pt-6">
                <div class="grid gap-4 xl:grid-cols-2 2xl:grid-cols-3"></div>
            </div>
        </main>
      </div>
    </div>



    <script src="./components/nav-component.js"></script>
    <script src="./components/sidebar-component.js"></script>
    <script src="./components/sidebar.js"></script>
  </body>
</html>
